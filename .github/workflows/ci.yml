name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test -race ./...

      - name: Build the Linux binaries
        working-directory: server
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/gamesave-linux-amd64 ./cmd/gamesave
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/gamesave-linux-arm64 ./cmd/gamesave

      - uses: actions/upload-artifact@v4
        with:
          name: gamesave-server
          path: server/dist

  client:
    name: client (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust version
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-dev libwayland-dev

      - name: Format
        working-directory: desktop
        run: cargo fmt --check

      - name: Lint
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test

      - name: Build
        working-directory: desktop
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: gamesave-client-linux
          path: desktop/target/release/gamesave

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: sh -n scripts/install.sh

      - name: Python syntax
        run: python3 -m py_compile scripts/install.py
