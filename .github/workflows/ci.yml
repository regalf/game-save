name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test -race ./...

      - name: Build the Linux binaries
        working-directory: server
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/gamesave-linux-amd64 ./cmd/gamesave
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/gamesave-linux-arm64 ./cmd/gamesave

      - uses: actions/upload-artifact@v4
        with:
          name: gamesave-server
          path: server/dist

  client:
    name: client (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust version
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-dev libwayland-dev

      - name: Format
        working-directory: desktop
        run: cargo fmt --check

      - name: Lint
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test

      - name: Build
        working-directory: desktop
        run: cargo build --release

      - name: Upload the Linux client
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gamesave-client-linux
          path: desktop/target/release/gamesave

      - name: Upload the Windows client
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gamesave-client-windows
          path: desktop/target/release/gamesave.exe

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: sh -n scripts/install.sh
        shell: bash

      - name: Latest.json syntax
        run: sh -n scripts/latest-json.sh
        shell: bash

      - name: Python syntax
        run: python3 -m py_compile scripts/install.py

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: Download the clients
        uses: actions/download-artifact@v4
        with:
          pattern: gamesave-client-*
          path: dist/clients
          merge-multiple: true

      - name: Name the clients
        run: |
          mv dist/clients/gamesave dist/clients/gamesave-client-linux-amd64
          mv dist/clients/gamesave.exe dist/clients/gamesave-client-windows-amd64.exe

      - name: Build the server binaries
        working-directory: server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o ../dist/gamesave-server-linux-amd64 ./cmd/gamesave
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o ../dist/gamesave-server-linux-arm64 ./cmd/gamesave
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o ../dist/gamesave-server-windows-amd64.exe ./cmd/gamesave

      - name: Write latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh scripts/latest-json.sh "$VERSION" \
            dist/gamesave-server-linux-amd64 \
            dist/gamesave-server-linux-arm64 \
            dist/gamesave-server-windows-amd64.exe \
            dist/clients/gamesave-client-linux-amd64 \
            dist/clients/gamesave-client-windows-amd64.exe

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gamesave-server-linux-amd64
            dist/gamesave-server-linux-arm64
            dist/gamesave-server-windows-amd64.exe
            dist/clients/gamesave-client-linux-amd64
            dist/clients/gamesave-client-windows-amd64.exe
            latest.json
          generate_release_notes: true
